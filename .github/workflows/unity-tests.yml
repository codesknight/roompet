name: Unity tests (manual)

# Runs the EditMode suite on a GitHub runner, but ONLY when asked, and only once a
# Unity licence is configured. Unlicensed CI would fail on every push for a reason
# that has nothing to do with the code, so it is opt-in:
#
#   Settings → Secrets and variables → Actions → add UNITY_LICENSE (and
#   UNITY_EMAIL / UNITY_PASSWORD if you prefer credentials over a .ulf licence).
#
# See https://game.ci/docs/github/activation for how to obtain UNITY_LICENSE.

on:
  workflow_dispatch:

jobs:
  licence:
    name: Is a Unity licence configured?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE is not set — skipping the Unity test run."
          fi

  editmode:
    name: EditMode tests
    needs: licence
    if: needs.licence.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: UnityMCPProject/Library
          key: Library-${{ hashFiles('UnityMCPProject/Assets/**', 'UnityMCPProject/Packages/**') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityMCPProject
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
